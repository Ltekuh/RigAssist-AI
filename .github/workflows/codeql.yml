# CodeQL security analysis for the RigAssist AI project.
# Python does not require a build step.
# Swift uses a manual Xcode build so CodeQL can correctly
# observe and analyze the iOS application target.

name: "CodeQL Advanced"

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  schedule:
    - cron: '43 1 * * 2'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})

    # Swift/Xcode requires macOS.
    # Python can run on Ubuntu.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none

          - language: swift
            build-mode: manual

    steps:
      # Pull the repository contents onto the GitHub Actions runner.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Initialize CodeQL for the language selected by the matrix.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL was unable to automatically discover/build the
      # RigAssistAI Xcode target, so Swift is built manually.
      #
      # This step only runs for the Swift job. Python skips it.
      - name: Build Swift project
        if: matrix.language == 'swift'
        shell: bash
        run: |
          xcodebuild \
            -project RigAssistAI/RigAssistAI.xcodeproj \
            -scheme RigAssistAI \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Analyze the source captured by CodeQL and upload the results.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
