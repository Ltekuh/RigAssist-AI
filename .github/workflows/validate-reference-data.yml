name: Validate reference data

on:
  push:
    paths:
      - "data/**"
      - "scripts/validate_reference_data.py"
  pull_request:
    paths:
      - "data/**"
      - "scripts/validate_reference_data.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate reference dataset
        run: python scripts/validate_reference_data.py data/reference_records.json
