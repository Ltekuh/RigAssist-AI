name: iOS Simulator Build

on:
  push:
    branches: ["dev", "feature-dev"]
  pull_request:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app
        run: |
          xcodebuild \
            -project RigAssistAI/RigAssistAI.xcodeproj \
            -scheme RigAssistAI \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            DerivedData/Build/Products/Debug-iphonesimulator/RigAssistAI.app \
            artifacts/RigAssistAI-simulator.zip

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: rigassist-ios-simulator-app
          path: artifacts/RigAssistAI-simulator.zip
          if-no-files-found: error
          retention-days: 14
